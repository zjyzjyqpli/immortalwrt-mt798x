name: build-q3000
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git wget curl flex bison gawk gettext binutils unzip file rsync zstd python3 python3-pip python3-setuptools libncurses-dev libssl-dev gcc-multilib g++-multilib subversion
      - name: Configure Q3000
        run: |
          cp q3000.config .config
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Build firmware
        run: |
          make defconfig
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: q3000-firmware
          path: bin/targets/mediatek/mt7981/
          retention-days: 7
