name: build-q3000
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git wget curl flex bison gawk gettext binutils unzip file rsync zstd python3 python3-pip python3-setuptools libncurses-dev libssl-dev gcc-multilib g++-multilib subversion
      - name: Configure Q3000
        run: |
          cp defconfig/mt7981-ax3000.config .config
          python3 -c "
import re
lines = open('.config').read().splitlines()
out = []
for line in lines:
    if line.startswith('CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_') and 'ikuai_q3000' not in line:
        line = line.replace('=y', '=n')
    out.append(line)
out.append('CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_ikuai_q3000=y')
out.append('CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_ikuai_q3000=""')
open('.config','w').write('
'.join(out))
"
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Build firmware
        run: |
          make defconfig
          make -j$(nproc) FORCE_UNSAFE_CONFIGURE=1
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: q3000-firmware
          path: bin/targets/mediatek/mt7981/
          retention-days: 7
